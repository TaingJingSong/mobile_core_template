name: Release

on:
  push:
    tags:
      - 'v*.*.*'

permissions:
  contents: write

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.44.3'
          cache: true
      - run: flutter pub get
      - run: dart format --output=none --set-exit-if-changed lib test
      - run: flutter analyze --fatal-infos
      - run: flutter test
      - name: Verify template tooling when present
        if: ${{ hashFiles('tool/mobile_core.dart') != '' }}
        run: |
          python3 -m unittest discover -s tool/tests -v
          bash scripts/test_generated_projects.sh

  android-release:
    needs: verify
    name: Android release AAB
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.44.3'
          channel: stable
          cache: true

      - name: Decode keystore
        env:
          KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
        run: |
          echo "$KEYSTORE_BASE64" | base64 --decode > android/app/upload-keystore.jks

      - name: Write key.properties
        env:
          KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
          STORE_PASSWORD: ${{ secrets.ANDROID_STORE_PASSWORD }}
        run: |
          cat > android/key.properties <<EOF
          storePassword=$STORE_PASSWORD
          keyPassword=$KEY_PASSWORD
          keyAlias=$KEY_ALIAS
          storeFile=upload-keystore.jks
          EOF

      - name: Install dependencies
        run: flutter pub get

      - name: Build release AAB
        run: flutter build appbundle --release -t lib/main.dart

      - name: Rename artifact
        run: |
          VERSION="${GITHUB_REF_NAME#v}"
          mv build/app/outputs/bundle/release/app-release.aab \
             "build/app/outputs/bundle/release/app-${VERSION}.aab"

      - uses: actions/upload-artifact@v4
        with:
          name: android-aab
          path: build/app/outputs/bundle/release/*.aab

      - uses: softprops/action-gh-release@v2
        with:
          files: build/app/outputs/bundle/release/*.aab
          generate_release_notes: true

  ios-release:
    needs: verify
    name: iOS unsigned app bundle ZIP
    runs-on: macos-latest
    timeout-minutes: 45

    steps:
      - uses: actions/checkout@v4

      - uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.44.3'
          channel: stable
          cache: true

      - name: Install dependencies
        run: flutter pub get

      - name: Build iOS (no code sign)
        run: flutter build ios --release --no-codesign -t lib/main.dart

      - name: Zip app
        run: |
          cd build/ios/iphoneos
          zip -r Runner.zip Runner.app

      - uses: actions/upload-artifact@v4
        with:
          name: ios-unsigned-app-bundle
          path: build/ios/iphoneos/Runner.zip

      - uses: softprops/action-gh-release@v2
        with:
          files: build/ios/iphoneos/Runner.zip
