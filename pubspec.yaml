name: app_base
description: "Mobile core template"
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: ^3.12.2

dependencies:
  flutter:
    sdk: flutter
  cupertino_icons: ^1.0.8
  get_it: ^9.3.0
  dio: ^5.11.1
  provider: ^6.1.5+1
  date_format: ^2.0.9
  internet_connection_checker_plus: ^3.1.2
  dio_smart_retry: ^7.0.1
  retry: ^3.1.2

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0
flutter:
  uses-material-design: true

  # To add assets to your application, add an assets section, like this:
  # assets:
